<div class="container-fluid mt-4">
  <h1 class="mb-4">Provider Dashboard</h1>

  <!-- Loading & Error -->
  <div *ngIf="loading" class="text-center mb-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Stat Cards -->
  <div class="row mb-4">
    <div class="col-md-3" *ngFor="let stat of [
      { title: 'Services', value: totalServices, class: 'bg-primary' },
      { title: 'Reservations', value: totalReservations, class: 'bg-warning text-dark' },
      { title: 'Completed', value: totalCompleted, class: 'bg-success' },
      { title: 'Reviews', value: totalReviews, class: 'bg-info text-dark' }
    ]">
      <div class="card text-white stat-card" [ngClass]="stat.class">
        <div class="card-body text-center">
          <h6>{{ stat.title }}</h6>
          <div class="fs-4">{{ stat.value }}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart Section -->
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">Reservation Status Distribution</div>
        <div class="card-body">
          <canvas
            baseChart
            [data]="reservationChart"
            [type]="'doughnut'"
            [plugins]="[ChartDataLabels]">
          </canvas>
        </div>
      </div>
    </div>

  </div>
  <!-- Reservation Stats (Bar Chart) -->


  <div class="row mb-4">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Reservations per Day</h5>
          <div style="width: 200px;">
            <select class="form-select form-select-sm" [(ngModel)]="selectedRange" (change)="applyDateFilter()">
              <option value="7">Last 7 Days</option>
              <option value="30">Last 30 Days</option>
              <option value="all">All Time</option>
            </select>
          </div>
        </div>
        <div class="card-body">
          <canvas
            baseChart
            [data]="reservationStatsChart"
            [type]="'bar'">
          </canvas>
        </div>
      </div>
    </div>
  </div>



  <!-- Optional: Add service/reservation/review lists here -->
</div>
