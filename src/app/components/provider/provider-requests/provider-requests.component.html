<div class="container mt-4">
  <div class="row" style="margin-bottom: 15px">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center text-white">
          <h5 class="mb-0">Service Requests</h5>
          <div class="btn-group">
            <button class="btn btn-filter" [class.active]="!statusFilter" (click)="clearFilters()">
              All
            </button>

            <button class="btn btn-filter pending" [class.active]="statusFilter === ReservationStatus.PENDING"
                    (click)="setStatusFilter(ReservationStatus.PENDING)">
              Pending
            </button>

            <button class="btn btn-filter accepted" [class.active]="statusFilter === ReservationStatus.ACCEPTED"
                    (click)="setStatusFilter(ReservationStatus.ACCEPTED)">
              Accepted
            </button>

            <button class="btn btn-filter rejected" [class.active]="statusFilter === ReservationStatus.REJECTED"
                    (click)="setStatusFilter(ReservationStatus.REJECTED)">
              Rejected
            </button>

            <button class="btn btn-filter completed" [class.active]="statusFilter === ReservationStatus.COMPLETED"
                    (click)="setStatusFilter(ReservationStatus.COMPLETED)">
              Completed
            </button>

            <button class="btn btn-filter cancelled" [class.active]="statusFilter === ReservationStatus.CANCELLED"
                    (click)="setStatusFilter(ReservationStatus.CANCELLED)">
              Cancelled
            </button>

          </div>
        </div>

        <div class="card-body">
          <!-- Loading -->
          <div *ngIf="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <!-- Error -->
          <div *ngIf="error" class="alert alert-danger text-center" role="alert">
            {{ error }}
          </div>

          <!-- Requests List -->
          <div *ngIf="!loading && !error">
            <div *ngIf="filteredRequests.length === 0" class="text-center py-4">
              <p class="text-muted">No requests found</p>
            </div>

            <div class="list-group" *ngIf="filteredRequests.length > 0">
              <div *ngFor="let request of paginatedRequests" class="list-group-item">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <h6 class="mb-2 text-primary fw-semibold">Service: <span class="text-dark">{{ getServiceName(request.serviceId) }}</span></h6>
                    <p class="mb-1">Client: <span class="fw-semibold">{{ getUserName(request.clientId) }}</span></p>
                    <p class="mb-0">Date: <span class="text-muted">{{ request.reservationDate | date:'medium' }}</span></p>
                    <span class="badge" [ngClass]="{
                      'bg-warning': request.status === ReservationStatus.PENDING,
                      'bg-success': request.status === ReservationStatus.ACCEPTED,
                      'bg-danger': request.status === ReservationStatus.REJECTED,
                      'bg-info': request.status === ReservationStatus.COMPLETED,
                      'bg-secondary': request.status === ReservationStatus.CANCELLED
                    }">
                      {{ request.status }}
                    </span>
                  </div>

                  <div class="btn-group d-flex flex-column gap-2 text-end" *ngIf="request.status === ReservationStatus.PENDING || request.status === ReservationStatus.ACCEPTED">
                    <!-- Buttons for PENDING -->
                    <ng-container *ngIf="request.status === ReservationStatus.PENDING">
                      <button class="btn btn-sm btn-outline-success" (click)="updateStatus(request.id, ReservationStatus.ACCEPTED)">Accept</button>
                      <button class="btn btn-sm btn-outline-danger" (click)="updateStatus(request.id, ReservationStatus.REJECTED)">Reject</button>
                    </ng-container>

                    <!-- Button for ACCEPTED -->
                    <ng-container *ngIf="request.status === ReservationStatus.ACCEPTED">
                      <button class="btn btn-sm btn-outline-primary" (click)="updateStatus(request.id, ReservationStatus.COMPLETED)">  Mark as Completed
                      </button>
                    </ng-container>
                  </div>

                </div>
              </div>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-center mt-4" *ngIf="filteredRequests.length > 0">
              <mat-paginator
                [length]="totalItems"
                [pageSize]="pageSize"
                [pageSizeOptions]="pageSizeOptions"
                [pageIndex]="pageIndex"
                aria-label="Select page"
                (page)="handlePageEvent($event)">
              </mat-paginator>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
