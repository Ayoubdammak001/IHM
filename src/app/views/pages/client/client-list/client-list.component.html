<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h5 class="card-title mb-0">Client Management</h5>
    </div>

    <div class="card-body">
      <!-- État de chargement -->
      <div *ngIf="loading" class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Message d'erreur -->
      <div *ngIf="error" class="alert alert-danger" role="alert">
        {{ error }}
      </div>

      <!-- Liste des clients -->
      <div *ngIf="!loading && !error">
        <div *ngIf="clients.length === 0" class="text-center py-3">
          <p class="text-muted">No clients found</p>
        </div>

        <div *ngIf="clients.length > 0">
          <div class="list-group">
            <div
              *ngFor="let client of clients"
              class="list-group-item">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h6 class="mb-1">{{ client.username }}</h6>
                  <p class="mb-1 text-muted">Email: {{ client.email }}</p>
                  <p class="mb-1 text-muted">Phone: {{ client.phone }}</p>
                  <p class="mb-1 text-muted">Address: {{ client.address }}</p>
                </div>
                <button class="btn btn-sm btn-outline-primary"
                        [routerLink]="['/client/profile', client.id]">
                  View Profile
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
