<c-container>
  <c-row>
    <c-col xs="12">
      <c-card>
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">My Reviews</h5>
        </div>

        <c-card-body>
          <!-- Error -->
          <div *ngIf="error" class="alert alert-danger mb-3">
            {{ error }}
          </div>

          <!-- Loading -->
          <div *ngIf="loading" class="text-center my-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading reviews...</p>
          </div>

          <!-- Table des reviews -->
          <div class="table-responsive" *ngIf="!loading">
            <table cTable hover responsive class="table table-hover">
              <thead>
              <tr>
                <th>Service</th>
                <th>Rating</th>
                <th>Comment</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
              </thead>
              <tbody>
              <tr *ngFor="let review of paginatedReviews">
                <td>{{ getServiceName(review.serviceId) }}</td>
                <td>
                  <span class="text-warning">{{ getRatingStars(review.rating) }}</span>
                </td>
                <td>{{ review.comment }}</td>
                <td>{{ review.date | date: 'mediumDate' }}</td>
                <td>
                  <button
                    cButton
                    color="danger"
                    size="sm"
                    (click)="deleteReview(review.id)">
                    Delete
                  </button>
                </td>
              </tr>
              <tr *ngIf="reviews.length === 0">
                <td colspan="5" class="text-center text-muted">No reviews found</td>
              </tr>
              </tbody>
            </table>
          </div>

          <!-- Paginator -->
          <div class="mt-3" *ngIf="reviews.length > 0 && !loading">
            <mat-paginator
              [length]="totalItems"
              [pageSize]="pageSize"
              [pageSizeOptions]="pageSizeOptions"
              [pageIndex]="pageIndex"
              (page)="handlePageEvent($event)">
            </mat-paginator>
          </div>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</c-container>
